[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.seal == 'Blue' and #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit and not self.ability.extra_enhancement then
'''
position = "at"
payload = '''
if self.seal == 'Blue' and (next(SMODS.find_card('j_leper_Sealed_Explorer')) or #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit) and not self.ability.extra_enhancement then
local passed = not next(SMODS.find_card('j_leper_Sealed_Explorer')) or #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit
if not passed then
    for k, v in pairs(SMODS.find_card('j_leper_Sealed_Explorer')) do
        if SMODS.pseudorandom_probability(v, 'j_leper_Sealed_Explorer_negative', 1, v.ability.extra.odds) then
            G.GAME.consumeable_buffer = G.GAME.consumeable_buffer - 1
            passed = true
            break
        end
    end
end
if passed then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
local card = create_card(card_type,G.consumeables, nil, nil, nil, nil, _planet, 'blusl')
'''
position = "after"
payload = '''
if next(SMODS.find_card('j_leper_Sealed_Explorer')) and #G.consumeables.cards >= G.consumeables.config.card_limit then
    card:set_edition('e_negative')
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
ret.effect = true
'''
position = "after"
payload = '''
end
'''
match_indent = true
